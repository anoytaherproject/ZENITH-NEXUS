<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ZENITH NEXUS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #05080d;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 32px 25px;
      background: #0d131c;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    }

    .logo {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .logo span {
      color: #8da9ff;
    }

    .subtitle {
      text-align: center;
      color: #9ca7b8;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #080c12;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #8da9ff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #8da9ff;
      color: #05080d;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #9ca7b8;
      text-decoration: none;
      font-size: 14px;
    }

    .notice {
      display: none;
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(141,169,255,0.1);
      color: #b9c8ff;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      ZENITH <span>NEXUS</span>
    </div>

    <div class="subtitle">
      Secure Member Login
    </div>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        LOGIN
      </button>

    </form>

    <div class="notice" id="notice">
      Login form berhasil digunakan.
    </div>

    <a href="index.html" class="back">
      ← Back to Home
    </a>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("notice").style.display = "block";
    });
  </script>

</body>
</html>
