<!DOCTYPE html>

  <title>Profile - ZENITH NEXUS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #05080d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: #0d131c;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 15px;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #9ca7b8;
      margin: 12px 0;
    }

    a {
      display: block;
      text-align: center;
      padding: 13px;
      border-radius: 9px;
      background: #8da9ff;
      color: #05080d;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">
      <h1>Profile</h1>

      <p>Nama: Member</p>
