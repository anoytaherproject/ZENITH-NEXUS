<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crypto Market</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div>
      <h1>₿ Crypto Market</h1>
      <p>Live Cryptocurrency Prices</p>
    </div>

    <button onclick="loadMarket()">⟳ Refresh</button>
  </header>

  <section class="hero">
    <h2>Crypto Market</h2>
    <p>Pantau harga cryptocurrency secara real-time.</p>
  </section>

  <main class="market">

    <div class="market-title">
      <span>#</span>
      <span>Coin</span>
      <span>Price</span>
      <span>24h</span>
    </div>

    <div id="market-list">
      <p class="loading">Loading...</p>
    </div>

  </main>

  <footer>
    Crypto Market © 2026
  </footer>

  <script src="script.js"></script>

</body>
</html>
