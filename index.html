<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith Nexus</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #070b14;
      color: white;
      min-height: 100vh;
    }

    nav {
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #202838;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .login {
      color: white;
      text-decoration: none;
      border: 1px solid #56627a;
      padding: 10px 18px;
      border-radius: 8px;
    }

    .hero {
      text-align: center;
      padding: 110px 20px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .hero p {
      color: #aab4c8;
      font-size: 18px;
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 35px;
      padding: 15px 30px;
      background: white;
      color: #070b14;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">ZENITH NEXUS</div>
    <a class="login" href="#">LOGIN</a>
  </nav>

  <section class="hero">
    <h1>THE FUTURE OF<br>DIGITAL FINANCE</h1>

    <p>
      Discover a modern digital finance platform
      designed for the next generation.
    </p>

    <a class="button" href="#">GET STARTED</a>
  </section>

</body>
</html>
